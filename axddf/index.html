<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><style>*{margin:0;padding:0;user-select:none;-webkit-user-select:none;touch-action:none}body{height:100vh;background:#111;overflow:hidden}.plane{width:40px;height:40px;background:#4cf;border-radius:8px;position:absolute;left:50px;bottom:0}.over{color:#f44;font-size:48px;position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);display:none}.win{color:#4f4;font-size:48px;position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);display:none}.btnRight{position:absolute;right:20px;bottom:30px;width:70px;height:70px;font-size:32px}.box{width:36px;height:36px;background:#fc4;position:absolute;left:20px;bottom:10px}</style></head><body><div class="plane" id="p"></div><div class="box" id="box"></div><button class="btnRight" id="btn">→</button><div class="over" id="txtOver">GAME OVER</div><div class="win" id="txtWin">通关!</div><script>const p=document.getElementById("p");const box=document.getElementById("box");const btn=document.getElementById("btn");const txtOver=document.getElementById("txtOver");const txtWin=document.getElementById("txtWin");let y=window.innerHeight-40,speed=0,g=0.3,isFly=false,gameLive=true,hitTop=false;let boxX=20,isMoveRight=false;function loop(){if(!gameLive)return;if(isFly&&!hitTop)speed-=0.6;else speed+=g;y+=speed;if(y<=0){y=0;hitTop=true}if(y>=window.innerHeight-40){y=window.innerHeight-40;if(hitTop){gameLive=false;txtOver.style.display="block"}}p.style.top=y+"px";if(isMoveRight){boxX+=0.3;box.style.left=boxX+"px";if(boxX>=300){gameLive=false;txtWin.style.display="block"}}requestAnimationFrame(loop)}btn.onmousedown=()=>{if(gameLive)isMoveRight=true};btn.onmouseup=()=>{isMoveRight=false};btn.ontouchstart=(e)=>{e.preventDefault();if(gameLive)isMoveRight=true};btn.ontouchend=()=>{isMoveRight=false};document.body.onmousedown=()=>{if(gameLive&&!hitTop)isFly=true};document.body.onmouseup=()=>{isFly=false};document.body.ontouchstart=(e)=>{e.preventDefault();if(gameLive&&!hitTop)isFly=true};document.body.ontouchend=()=>{isFly=false};loop();</script></body></html>
